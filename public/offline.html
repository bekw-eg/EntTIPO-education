<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Офлайн режим — ENT TIPO</title>
  <link rel="icon" href="/icon.svg">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      background-color: #fbfaf8;
      color: #202b3b;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      padding: 24px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #d8e2ed;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #506579;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #2b559f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      min-height: 44px;
    }
    a { color: #2b559f; display: inline-block; padding: 12px 0; }
    :focus-visible { outline: 2px solid #2b559f; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) {
      body { background: #141923; color: #edf1f5; }
      .card { background: #1b222e; border-color: #344154; }
      p { color: #aebacb; } a { color: #a0c2ff; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Нет подключения к сети</h1>
    <p>
      Скачанные материалы доступны в офлайн-практике. Для остальных личных страниц требуется интернет.
    </p>
    <button class="btn" onclick="window.location.reload()">Повторить попытку</button>
    <p><a href="/offline-practice.html" id="practice-link">Открыть скачанные тренировки</a></p>
  </main>
  <script>
    try {
      const locale = localStorage.getItem('ent_tipo_locale');
      if (locale === 'kk') {
        document.documentElement.lang = 'kk';
        document.title = 'Желісіз режим — ENT TIPO';
        document.querySelector('h1').textContent = 'Желіге қосылу жоқ';
        document.querySelector('p').textContent = 'Жүктелген материалдар желісіз жаттығуда қолжетімді. Басқа жеке беттер үшін интернет қажет.';
        document.querySelector('#practice-link').textContent = 'Жүктелген жаттығуларды ашу';
        document.querySelector('button').textContent = 'Қайталап көру';
      } else if (locale === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'Offline — ENT TIPO';
        document.querySelector('h1').textContent = 'No network connection';
        document.querySelector('p').textContent = 'Downloaded materials are available in offline practice. Other personal pages require internet.';
        document.querySelector('#practice-link').textContent = 'Open downloaded practice';
        document.querySelector('button').textContent = 'Try again';
      }
    } catch { /* Offline recovery also works with blocked local storage. */ }
  </script>
</body>
</html>
