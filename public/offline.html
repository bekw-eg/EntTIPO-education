<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Офлайн режим — ENT TIPO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 32px;
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>Нет подключения к сети</h1>
    <p>
      Подключитесь к интернету, чтобы продолжить тренировку и загрузить данные своего аккаунта.
    </p>
    <button class="btn" onclick="window.location.reload()">Повторить попытку</button>
  </div>
  <script>
    try {
      const locale = localStorage.getItem('ent_tipo_locale');
      if (locale === 'kk') {
        document.documentElement.lang = 'kk';
        document.title = 'Желісіз режим — ENT TIPO';
        document.querySelector('h1').textContent = 'Желіге қосылу жоқ';
        document.querySelector('p').textContent = 'Жаттығуды жалғастырып, аккаунт деректерін жүктеу үшін интернетке қосылыңыз.';
        document.querySelector('button').textContent = 'Қайталап көру';
      } else if (locale === 'en') {
        document.documentElement.lang = 'en';
        document.title = 'Offline — ENT TIPO';
        document.querySelector('h1').textContent = 'No network connection';
        document.querySelector('p').textContent = 'Connect to the internet to continue your practice and load your account data.';
        document.querySelector('button').textContent = 'Try again';
      }
    } catch { /* Offline recovery also works with blocked local storage. */ }
  </script>
</body>
</html>
